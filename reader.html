<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stat Mech Notes Reader</title>
  <style>
    body {
      max-width: 980px;
      margin: 40px auto;
      padding: 0 22px 60px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.7;
      color: #222;
    }
    h1, h2, h3, h4 {
      color: #111;
      line-height: 1.25;
    }
    p, li {
      font-size: 16px;
    }
    code {
      background: #f6f8fa;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.95em;
    }
    pre {
      background: #f6f8fa;
      padding: 14px;
      overflow-x: auto;
      border-radius: 8px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 18px 0;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }
    a {
      color: #0366d6;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    blockquote {
      border-left: 4px solid #d0d7de;
      margin-left: 0;
      padding-left: 14px;
      color: #555;
    }
    img {
      max-width: 100%;
      height: auto;
    }
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div id="content"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const file = params.get('file') || 'leonard_susskind/README.md';
    const rawUrl = `https://raw.githubusercontent.com/rustedgy/statmech/main/${file}`;

    fetch(rawUrl)
      .then(r => {
        if (!r.ok) throw new Error('file not found');
        return r.text();
      })
      .then(md => {
        const normalized = md
          .replace(/\$\$([\s\S]*?)\$\$/g, '\\[ $1 \\]')
          .replace(/\$([^\n$]+?)\$/g, '\\($1\\)');

        document.getElementById('content').innerHTML = marked.parse(normalized, {
          gfm: true,
          breaks: false,
          headerIds: false
        });

        if (window.MathJax && MathJax.typesetPromise) {
          MathJax.typesetPromise();
        }
      })
      .catch(() => {
        document.getElementById('content').innerHTML = '<h1>Note not found</h1><p>The requested note could not be loaded.</p>';
      });
  </script>
</body>
</html>
